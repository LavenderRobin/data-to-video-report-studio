[project]
name = "data-to-video-report-studio"
version = "0.6.3"
description = "Desktop studio that turns tabular data + AI narration into rendered video reports."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "d2v-report-studio maintainers" }]
keywords = ["data-to-video", "report-generator", "ai-narration", "ffmpeg", "matplotlib", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "PySide6>=6.6,<7",
    "pandas>=2.1,<3",
    "matplotlib>=3.8,<4",
    "jinja2>=3.1,<4",
    "openai>=1.30,<2",
    "pydantic>=2.6,<3",
    "moviepy>=1.0.3,<2",
    "pyyaml>=6.0,<7",
    "rich>=13.7,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "ruff>=0.4", "mypy>=1.10"]
render = ["imageio-ffmpeg>=0.4.9"]

[project.scripts]
d2v-studio = "data_to_video_report_studio.bootstrap.app:main"
d2v-render = "data_to_video_report_studio.bootstrap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_to_video_report_studio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"